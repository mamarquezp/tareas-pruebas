# PostgreSQL 17 para las pruebas de integración.
# Puerto 5434, para no chocar con el Postgres de tu proyecto (5432)
# ni con el de la Semana 14 (5433).
services:
  db:
    image: postgres:17-alpine
    container_name: tareas-pruebas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pruebas
    ports:
      - '5434:5432'
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pruebas']
      interval: 3s
      timeout: 3s
      retries: 20
